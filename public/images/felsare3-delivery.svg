<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">فالسريع - توصيل سريع</title><desc id="desc">رسم توضيحي لمندوب توصيل بطابع برتقالي وأسود</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101114"/><stop offset="1" stop-color="#080808"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9d18"/><stop offset=".5" stop-color="#ff6200"/><stop offset="1" stop-color="#f23d16"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff5a00" stop-opacity=".45"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="900" height="760" rx="48" fill="url(#bg)"/>
<circle cx="670" cy="360" r="310" fill="url(#glow)" filter="url(#blur)"/>
<g opacity=".22" stroke="#ff7600" stroke-width="4"><path d="M-40 155L300 20"/><path d="M-40 250L420 65"/><path d="M-30 640L360 490"/><path d="M420 760L900 560"/></g>
<g transform="translate(75 92)">
 <path d="M55 135h220l-62 58H70zM25 182h225l-60 55H35zM0 228h175l-55 48H10z" fill="url(#orange)" opacity=".95"/>
 <text x="360" y="118" fill="#f4f4f2" font-size="72" font-weight="900" font-family="Cairo, Arial, sans-serif" text-anchor="middle">فال<tspan fill="#ff6800">سريع</tspan></text>
 <text x="360" y="166" fill="#b7b2ad" font-size="22" font-family="Cairo, Arial, sans-serif" text-anchor="middle">اطلبها... توصل فالسريع</text>
</g>
<!-- city -->
<g fill="#0a0a0a" opacity=".9"><path d="M500 430h45v-95h26v95h34V285h30v145h55v-82h22v82h62v-125h22v125h29v-72h20v72h45v155H500z"/></g>
<!-- road -->
<path d="M230 760C365 610 600 590 900 650V760z" fill="#0b0b0b"/>
<path d="M275 760c125-130 365-145 625-70" fill="none" stroke="url(#orange)" stroke-width="11" opacity=".9"/>
<path d="M365 760c110-90 285-105 440-55" fill="none" stroke="#ff8a00" stroke-width="5" stroke-dasharray="40 28" opacity=".8"/>
<!-- scooter -->
<g transform="translate(110 340)" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="220" cy="285" r="68" fill="#080808" stroke="#303030" stroke-width="13"/><circle cx="220" cy="285" r="24" fill="url(#orange)"/>
 <circle cx="510" cy="285" r="68" fill="#080808" stroke="#303030" stroke-width="13"/><circle cx="510" cy="285" r="24" fill="url(#orange)"/>
 <path d="M210 250h190l90-118h50l-60 120 58 12" fill="none" stroke="url(#orange)" stroke-width="22"/>
 <path d="M320 225h95l55-100" fill="none" stroke="#272727" stroke-width="34"/>
 <rect x="265" y="125" width="170" height="110" rx="25" fill="#151515" stroke="#ff7400" stroke-width="4"/>
 <path d="M275 125h150l-28-45h-95z" fill="#202020"/>
 <!-- rider body -->
 <path d="M350 85c-28-55-92-67-132-30-28 26-30 66-8 97l58 78 105-15z" fill="#171717" stroke="#ff7a00" stroke-width="5"/>
 <circle cx="230" cy="38" r="52" fill="#121212" stroke="#ff8200" stroke-width="6"/>
 <path d="M192 38c25-35 64-29 83-8l-10 34-67 4z" fill="#282828"/>
 <path d="M320 105l-76 60 55 80 72-60z" fill="#202020"/>
 <!-- delivery box -->
 <rect x="78" y="105" width="175" height="145" rx="20" fill="#121212" stroke="#ff7600" stroke-width="5"/>
 <path d="M90 145h110" stroke="#ff6800" stroke-width="9"/><path d="M90 165h78" stroke="#ff8a00" stroke-width="6"/>
 <text x="165" y="215" fill="#f3f1ed" font-size="28" font-family="Cairo,Arial,sans-serif" text-anchor="middle">فالسريع</text>
</g>
<!-- map pin -->
<g transform="translate(705 410)"><path d="M58 0c-39 0-58 30-58 61 0 45 58 112 58 112s58-67 58-112C116 30 97 0 58 0z" fill="url(#orange)"/><circle cx="58" cy="59" r="20" fill="#171717"/></g>
<g transform="translate(610 645)" font-family="Cairo,Arial,sans-serif" font-weight="700" font-size="22" fill="#ddd">
 <text x="0" y="0">⚡ أسرع</text><text x="0" y="38">◈ موثوق</text><text x="0" y="76">⌖ أقرب لك</text>
